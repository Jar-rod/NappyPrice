[project]
name = "nappy-price-watch"
version = "0.1.0"
description = "Daily nappy and bin-refill price tracker for South African stores"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.9",
    "supabase>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
scraper = ["playwright>=1.47"]
app = ["streamlit>=1.42", "plotly>=5.24", "pandas>=2.2"]
dev = ["pytest>=8.3"]

[tool.uv]
default-groups = ["scraper", "app", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
